      switch (action.type) {
        case 'LOAD_TEMPLATE':
          return { ...state, currentProject: action.payload, activeTemplateId: action.payload.id };
        case 'SET_TAB':
          return { ...state, activeTab: action.payload };
        case 'UPDATE_METADATA':
          return { ...state, currentProject: { ...state.currentProject, ...action.payload } };
        case 'ADD_ENTITY':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              erd: {
                ...state.currentProject.erd,
                entities: [...(state.currentProject.erd?.entities || []), action.payload]
              }
            }
          };

            ...state,
            currentProject: {
              ...state.currentProject,
              erd: {
                ...state.currentProject.erd,
                entities: state.currentProject.erd?.entities.filter(e => e.id !== action.payload)
              }
            }
          };
        case 'UPDATE_ERD_SYNTAX':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              erd: { ...state.currentProject.erd, mermaidSyntax: action.payload }
            }
          };
        case 'UPDATE_DIAGRAM':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              diagrams: { ...state.currentProject.diagrams, [action.payload.key]: action.payload.syntax }
            }
          };
        case 'ADD_STORY':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              stories: [action.payload, ...(state.currentProject.stories || [])]
            }
          };
        case 'UPDATE_STORY':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              stories: state.currentProject.stories.map(s => s.id === action.payload.id ? action.payload : s)
            }
          };
        case 'DELETE_STORY':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              stories: state.currentProject.stories.filter(s => s.id !== action.payload)
            }
          };
        case 'ADD_BUSINESS_RULE':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              architecture: {
                ...state.currentProject.architecture,
                businessLayer: [...(state.currentProject.architecture?.businessLayer || []), action.payload]
              }
            }
          };
        case 'DELETE_BUSINESS_RULE':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              architecture: {
                ...state.currentProject.architecture,
                businessLayer: state.currentProject.architecture?.businessLayer.filter(b => b.id !== action.payload)
              }
            }
          };
        case 'ADD_ENDPOINT':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              architecture: {
                ...state.currentProject.architecture,
                functionalLayer: [...(state.currentProject.architecture?.functionalLayer || []), action.payload]
              }
            }
          };
        case 'DELETE_ENDPOINT':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              architecture: {
                ...state.currentProject.architecture,
                functionalLayer: state.currentProject.architecture?.functionalLayer.filter((_, idx) => idx !== action.payload)
              }
            }
          };
        case 'ADD_ROADMAP':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              roadmap: [...(state.currentProject.roadmap || []), action.payload]
            }
          };
        case 'DELETE_ROADMAP':
          return {
            ...state,
            currentProject: {
              ...state.currentProject,
              roadmap: state.currentProject.roadmap.filter(r => r.id !== action.payload)
            }
          };
        case 'IMPORT_JSON':
          return { ...state, currentProject: action.payload, activeTemplateId: 'custom' };
        case 'EXTEND_PROJECT': {
          const current = state.currentProject;
          const { businessRules, dataLayer, functionalLayer, erdEntities, stories, roadmap, erdMermaidDelta } = action.payload;
          const newBusiness = [...(current.architecture?.businessLayer || []), ...(businessRules || [])];
          const newData = [...(current.architecture?.dataLayer || []), ...(dataLayer || [])];
          const newFunctional = [...(current.architecture?.functionalLayer || []), ...(functionalLayer || [])];
          const newEntities = [...(current.erd?.entities || []), ...(erdEntities || [])];
          const newStories = [...(stories || []), ...(current.stories || [])];
          const newRoadmap = [...(current.roadmap || []), ...(roadmap || [])];

          let newMermaid = current.erd?.mermaidSyntax || 'erDiagram';
          if (erdMermaidDelta) {
            newMermaid += '\n' + erdMermaidDelta;
          } else if (erdEntities && erdEntities.length > 0) {
            erdEntities.forEach(e => {
              newMermaid += `\n    ${e.name} {\n        UUID id PK\n    }`;
            });
          }

          return {
            ...state,
            currentProject: {
              ...current,
              architecture: {
                ...current.architecture,
                businessLayer: newBusiness,
                dataLayer: newData,
                functionalLayer: newFunctional
              },
              erd: {
                ...current.erd,
                entities: newEntities,
                mermaidSyntax: newMermaid
              },
              stories: newStories,
              roadmap: newRoadmap
            }
          };
        }
        default:
          return state;
      }
    }

      useEffect(() => {
        let isMounted = true;
        const renderChart = async () => {
          try {
            setError(null);
            if (window.mermaid) {
              window.mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                securityLevel: 'loose',
                themeVariables: {
                  darkMode: true,
                  background: '#0f172a',

              });

              const { svg } = await window.mermaid.render(uniqueId, chartCode.trim());
              if (isMounted) setSvgContent(svg);
            }
          } catch (err) {
            if (isMounted) setError(err.message || 'Diagram syntax error');
          }
        };

        renderChart();
        return () => { isMounted = false; };

    // --- MARKDOWN SPEC COMPILER ---
    function compileMarkdownSpec(project) {
      const dateStr = new Date().toISOString().split('T')[0];
      let md = `# ${project.name} - SDLC System Architecture & Planning Specification\n\n`;
      md += `> **Version**: ${project.version || '1.0.0'}  \n`;
      md += `> **Generated Date**: ${dateStr}  \n`;
      md += `> **System Scope**: ${project.description}  \n\n---\n\n`;

      if (project.targetStack) {
        md += `## 1. Target Technology Stack\n\n`;
        md += `| Tier | Technology Components |\n| :--- | :--- |\n`;
        md += `| **Frontend** | ${project.targetStack.frontend} |\n`;
        md += `| **Backend** | ${project.targetStack.backend} |\n`;
        md += `| **Database** | ${project.targetStack.database} |\n`;
        md += `| **External / Cloud** | ${project.targetStack.external} |\n\n`;
      }

      md += `## 2. Multi-Tier Layered Architecture Design\n\n`;
      md += `### 2.1 Business Layer Policies & Domain Invariants\n\n`;
      (project.architecture?.businessLayer || []).forEach(b => {
        md += `- **${b.title}**: ${b.desc}\n`;
      });

      md += `\n### 2.2 Data Layer Schema & Storage Strategy\n\n`;
      md += `| Collection / Table | Storage Type | Cardinality | Indexing Strategy |\n| :--- | :--- | :--- | :--- |\n`;
      (project.architecture?.dataLayer || []).forEach(d => {
        md += `| \`${d.collection}\` | ${d.type} | ${d.count} | ${d.index} |\n`;
      });

      md += `\n### 2.3 Functional Layer REST API Contracts\n\n`;
      md += `| Method | Path | Access | Responsibility |\n| :--- | :--- | :--- | :--- |\n`;
      (project.architecture?.functionalLayer || []).forEach(f => {
        md += `| \`${f.method}\` | \`${f.path}\` | ${f.access} | ${f.desc} |\n`;
      });

      md += `\n---\n\n## 3. Entity Relationship Diagram (ERD)\n\n`;
      if (project.erd?.mermaidSyntax) {
        md += `\`\`\`mermaid\n${project.erd.mermaidSyntax}\n\`\`\`\n\n`;
      }

      md += `### Data Dictionary\n\n`;
      (project.erd?.entities || []).forEach(ent => {
        md += `#### Entity: \`${ent.name}\` (${ent.description || ''})\n\n`;
        md += `| Field Name | Type | Key |\n| :--- | :--- | :---: |\n`;
        (ent.fields || []).forEach(f => {
          md += `| \`${f.name}\` | ${f.type} | ${f.key || '-'} |\n`;
        });
        md += `\n`;
      });

      md += `---\n\n## 4. System Flows & UML Diagrams\n\n`;
      if (project.diagrams?.dfdLevel0) {
        md += `### 4.1 Data Flow Diagram (DFD Level 0 - Context)\n\n\`\`\`mermaid\n${project.diagrams.dfdLevel0}\n\`\`\`\n\n`;
      }
      if (project.diagrams?.dfdLevel1) {
        md += `### 4.2 Data Flow Diagram (DFD Level 1 - Decomposition)\n\n\`\`\`mermaid\n${project.diagrams.dfdLevel1}\n\`\`\`\n\n`;
      }
      if (project.diagrams?.classDiagram) {
        md += `### 4.3 UML Class Diagram\n\n\`\`\`mermaid\n${project.diagrams.classDiagram}\n\`\`\`\n\n`;
      }
      if (project.diagrams?.sequenceAuth) {
        md += `### 4.4 Event Sequence Diagram\n\n\`\`\`mermaid\n${project.diagrams.sequenceAuth}\n\`\`\`\n\n`;
      }

      md += `---\n\n## 5. Agile User Stories & Story Points Backlog\n\n`;
      const totalPts = (project.stories || []).reduce((acc, s) => acc + (parseInt(s.points) || 0), 0);
      md += `**Total Estimated Velocity**: **${totalPts} Story Points** across **${(project.stories || []).length} user stories**.\n\n`;
      md += `| ID | Epic | Title | Points | Priority | Status | User Story Statement |\n| :--- | :---: | :--- | :---: | :---: | :---: | :--- |\n`;
      (project.stories || []).forEach(s => {
        md += `| \`${s.id}\` | ${s.epic} | ${s.title} | ${s.points} pts | ${s.priority} | ${s.status} | ${s.statement} |\n`;
      });

      md += `\n---\n\n## 6. Further Work & Engineering Horizons\n\n`;
      md += `| Horizon | Initiative | Impact | Status | Description |\n| :--- | :--- | :---: | :---: | :--- |\n`;
      (project.roadmap || []).forEach(r => {
        md += `| ${r.horizon} | **${r.title}** | ${r.impact} | ${r.status} | ${r.desc} |\n`;
      });

      return md;
    }

                  <span style={{ fontWeight: '700' }}>Live Mermaid ERD Canvas</span>
                  <span className="badge badge-cyan">Crow's Foot</span>
                </div>
                {isEditing ? (
                  <div style={{ padding: '1rem' }}>
                    <textarea className="diagram-code-editor" style={{ minHeight: '350px' }} value={syntax} onChange={e => setSyntax(e.target.value)} />
                    <div style={{ marginTop: '0.5rem', display: 'flex', justifyContent: 'flex-end', gap: '0.5rem' }}>
                      <button className="btn btn-secondary btn-sm" onClick={() => setIsEditing(false)}>Cancel</button>
                      <button className="btn btn-primary btn-sm" onClick={handleSaveSyntax}>Save & Render</button>
                    </div>
                  </div>
                ) : (
                  <MermaidViewer chartCode={erd.mermaidSyntax || 'erDiagram'} id="erd" />
                )}
              </div>
            </div>
          </div>

          {showModal && (
            <div className="modal-backdrop" onClick={() => setShowModal(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 className="modal-title">Add Domain Entity</h3>
                  <button className="btn btn-secondary btn-sm" onClick={() => setShowModal(false)}><i className="fa-solid fa-xmark"></i></button>
                </div>
                <form onSubmit={handleAddEntity}>
                  <div className="modal-body">
                    <div className="form-group">
                      <label className="form-label">Entity Name</label>
                      <input className="form-input" value={newEnt.name} onChange={e => setNewEnt({ ...newEnt, name: e.target.value })} placeholder="e.g. INVOICE" required />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Description</label>
                      <input className="form-input" value={newEnt.description} onChange={e => setNewEnt({ ...newEnt, description: e.target.value })} />
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Save Entity</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- COMPONENT: TAB 4 FLOWS & UML ---
    const TabFlows = () => {
      const dispatch = useDispatch();
      const diagrams = useSelector(state => state.project.currentProject.diagrams || {});
      const [type, setType] = useState('dfdLevel0');
      const [isEditing, setIsEditing] = useState(false);
      const [draft, setDraft] = useState('');

      const types = [
        { key: 'dfdLevel0', label: 'DFD Level 0 (Context)', icon: 'fa-arrows-split-up-and-left' },
        { key: 'dfdLevel1', label: 'DFD Level 1 (Decomposition)', icon: 'fa-network-wired' },
        { key: 'classDiagram', label: 'UML Class Diagram', icon: 'fa-cube' },
        { key: 'sequenceAuth', label: 'Event Sequence Flow', icon: 'fa-timeline' }
      ];

      const currentCode = diagrams[type] || '';

      const handleSave = () => {
        dispatch({ type: 'UPDATE_DIAGRAM', payload: { key: type, syntax: draft } });
        setIsEditing(false);
      };

      return (
        <div className="tab-content">
          <div className="section-header">
            <div>
              <h2 className="section-title"><i className="fa-solid fa-diagram-project" style={{ color: 'var(--accent-purple)' }}></i> Behavioral Flows & Structural UML Diagrams</h2>
              <p className="section-desc">Data flow decomposition, class diagrams, and event sequence message flows.</p>
            </div>
            <button className={`btn ${isEditing ? 'btn-primary' : 'btn-outline'} btn-sm`} onClick={() => { if (isEditing) handleSave(); else { setDraft(currentCode); setIsEditing(true); } }}>
              <i className={`fa-solid ${isEditing ? 'fa-check' : 'fa-code'}`}></i> {isEditing ? 'Apply Diagram Code' : 'Edit Diagram Code'}
            </button>
          </div>

          <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1.5rem', flexWrap: 'wrap' }}>
            {types.map(t => (
              <button key={t.key} className={`filter-btn ${type === t.key ? 'active' : ''}`} onClick={() => { setType(t.key); setIsEditing(false); }}>
                <i className={`fa-solid ${t.icon}`} style={{ marginRight: '6px' }}></i> {t.label}
              </button>
            ))}
          </div>

          <div className="diagram-viewer-card">
            <div className="diagram-toolbar">
              <span style={{ fontWeight: '700' }}>{types.find(t => t.key === type)?.label}</span>
              <span className="badge badge-purple">Mermaid SVG</span>
            </div>

            {isEditing ? (
              <div style={{ padding: '1rem' }}>
                <textarea className="diagram-code-editor" style={{ minHeight: '380px' }} value={draft} onChange={e => setDraft(e.target.value)} />
                <div style={{ marginTop: '0.5rem', display: 'flex', justifyContent: 'flex-end', gap: '0.5rem' }}>
                  <button className="btn btn-secondary btn-sm" onClick={() => setIsEditing(false)}>Cancel</button>
                  <button className="btn btn-primary btn-sm" onClick={handleSave}>Save & Render</button>
                </div>
              </div>
            ) : (
              <MermaidViewer chartCode={currentCode} id={`flow_${type}`} />
            )}
          </div>
        </div>
      );
    };

    // --- COMPONENT: TAB 5 USER STORIES ---
    const TabStories = () => {
      const dispatch = useDispatch();
      const stories = useSelector(state => state.project.currentProject.stories || []);
      const [epicFilter, setEpicFilter] = useState('ALL');
      const [showModal, setShowModal] = useState(false);
      const [newStory, setNewStory] = useState({ id: `US-${Date.now().toString().slice(-4)}`, title: '', epic: 'AUTH', points: 3, priority: 'Must', status: 'To Do', statement: '' });

      const totalPoints = stories.reduce((acc, s) => acc + (parseInt(s.points) || 0), 0);
      const epics = ['ALL', ...new Set(stories.map(s => s.epic))];
      const filtered = stories.filter(s => epicFilter === 'ALL' || s.epic === epicFilter);

      const handleSave = (e) => {
        e.preventDefault();
        dispatch({ type: 'ADD_STORY', payload: { ...newStory } });
        setNewStory({ id: `US-${Date.now().toString().slice(-4)}`, title: '', epic: 'AUTH', points: 3, priority: 'Must', status: 'To Do', statement: '' });
        setShowModal(false);
      };

      return (
        <div className="tab-content">
          <div className="section-header">
            <div>
              <h2 className="section-title"><i className="fa-solid fa-list-check" style={{ color: 'var(--accent-emerald)' }}></i> Agile User Stories & Story Points Matrix</h2>
              <p className="section-desc">Comprehensive story backlog with Fibonacci estimation and sprint allocations.</p>
            </div>
            <button className="btn btn-primary btn-sm" onClick={() => setShowModal(true)}>
              <i className="fa-solid fa-plus"></i> Add User Story
            </button>
          </div>

          <div className="card" style={{ marginBottom: '1.5rem' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem' }}>
              <div>
                <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Total Backlog Velocity</div>
                <div style={{ fontSize: '1.8rem', fontWeight: '800', color: 'var(--accent-cyan)' }}>
                  {totalPoints} <span style={{ fontSize: '0.9rem', color: 'var(--text-muted)' }}>Story Points</span>
                  <span style={{ fontSize: '0.85rem', color: 'var(--text-dim)', marginLeft: '12px' }}>({stories.length} User Stories)</span>
                </div>
              </div>
              <div style={{ display: 'flex', gap: '0.75rem' }}>
                <div style={{ padding: '0.5rem 1rem', background: 'rgba(30,41,59,0.7)', borderRadius: 'var(--radius-md)' }}>
                  <div style={{ fontSize: '0.7rem', color: 'var(--text-dim)' }}>Avg Complexity</div>
                  <div style={{ fontSize: '1.1rem', fontWeight: '700', color: 'var(--accent-indigo)' }}>
                    {stories.length ? (totalPoints / stories.length).toFixed(1) : 0} pts
                  </div>
                </div>
                <div style={{ padding: '0.5rem 1rem', background: 'rgba(30,41,59,0.7)', borderRadius: 'var(--radius-md)' }}>
                  <div style={{ fontSize: '0.7rem', color: 'var(--text-dim)' }}>Sprint Estimates</div>
                  <div style={{ fontSize: '1.1rem', fontWeight: '700', color: 'var(--accent-emerald)' }}>
                    {Math.ceil(totalPoints / 20)} Sprints (~20 pts/ea)
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className="story-filters">
            <span style={{ fontSize: '0.8rem', color: 'var(--text-dim)', fontWeight: '600' }}>Filter by Epic:</span>
            {epics.map(ep => (
              <button key={ep} className={`filter-btn ${epicFilter === ep ? 'active' : ''}`} onClick={() => setEpicFilter(ep)}>
                {ep}
              </button>
            ))}
          </div>

          <div className="stories-grid">
            {filtered.map(s => (
              <div key={s.id} className="story-card">
                <div>
                  <div className="story-card-top">
                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                      <span className="story-id">{s.id}</span>
                      <span className="badge badge-purple">{s.epic}</span>
                      <span className={`badge ${s.priority === 'Must' ? 'badge-rose' : 'badge-amber'}`}>{s.priority}</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                      <span className="point-badge">{s.points} pts</span>
                      <button className="btn btn-danger btn-sm" style={{ padding: '0.2rem 0.4rem' }} onClick={() => dispatch({ type: 'DELETE_STORY', payload: s.id })}>
                        <i className="fa-solid fa-trash-can"></i>
                      </button>
                    </div>
                  </div>
                  <h4 className="story-title">{s.title}</h4>
                  <p className="story-statement">{s.statement}</p>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingTop: '0.75rem', borderTop: '1px solid var(--border-color)' }}>
                  <span style={{ fontSize: '0.75rem', color: 'var(--text-dim)' }}>Status:</span>
                  <select
                    className="form-select"
                    style={{ padding: '0.2rem 0.5rem', fontSize: '0.75rem' }}
                    value={s.status || 'To Do'}
                    onChange={e => dispatch({ type: 'UPDATE_STORY', payload: { ...s, status: e.target.value } })}
                  >
                    <option value="To Do">To Do</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Done">Done</option>
                  </select>
                </div>
              </div>
            ))}
          </div>

          {showModal && (
            <div className="modal-backdrop" onClick={() => setShowModal(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 className="modal-title">Create User Story</h3>
                  <button className="btn btn-secondary btn-sm" onClick={() => setShowModal(false)}><i className="fa-solid fa-xmark"></i></button>
                </div>
                <form onSubmit={handleSave}>
                  <div className="modal-body">
                    <div style={{ display: 'grid', gridTemplateColumns: '120px 1fr', gap: '1rem' }}>
                      <div className="form-group">
                        <label className="form-label">ID</label>
                        <input className="form-input" value={newStory.id} onChange={e => setNewStory({ ...newStory, id: e.target.value })} required />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Title</label>
                        <input className="form-input" value={newStory.title} onChange={e => setNewStory({ ...newStory, title: e.target.value })} placeholder="Feature title" required />
                      </div>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1rem' }}>
                      <div className="form-group">
                        <label className="form-label">Epic</label>
                        <input className="form-input" value={newStory.epic} onChange={e => setNewStory({ ...newStory, epic: e.target.value.toUpperCase() })} required />
                      </div>
                      <div className="form-group">
                        <label className="form-label">Points</label>
                        <select className="form-select" value={newStory.points} onChange={e => setNewStory({ ...newStory, points: parseInt(e.target.value) })}>
                          <option value="1">1 pt</option>
                          <option value="2">2 pts</option>
                          <option value="3">3 pts</option>
                          <option value="5">5 pts</option>
                          <option value="8">8 pts</option>
                        </select>
                      </div>
                      <div className="form-group">
                        <label className="form-label">Priority</label>
                        <select className="form-select" value={newStory.priority} onChange={e => setNewStory({ ...newStory, priority: e.target.value })}>
                          <option value="Must">Must</option>
                          <option value="Should">Should</option>
                          <option value="Could">Could</option>
                        </select>
                      </div>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Role Statement (As a... I want... So that...)</label>
                      <textarea className="form-textarea" value={newStory.statement} onChange={e => setNewStory({ ...newStory, statement: e.target.value })} required />
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Add Story</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- COMPONENT: TAB 6 ROADMAP ---
    const TabRoadmap = () => {
      const dispatch = useDispatch();
      const roadmap = useSelector(state => state.project.currentProject.roadmap || []);
      const [showModal, setShowModal] = useState(false);
      const [item, setItem] = useState({ horizon: 'Horizon 1 (0-3 Months)', title: '', impact: 'High', status: 'Planned', desc: '' });

      const horizons = ['Horizon 1 (0-3 Months)', 'Horizon 2 (3-6 Months)', 'Horizon 3 (6-12 Months)'];

      const handleSave = (e) => {
        e.preventDefault();
        dispatch({ type: 'ADD_ROADMAP', payload: { id: 'r_' + Date.now(), ...item } });
        setItem({ horizon: 'Horizon 1 (0-3 Months)', title: '', impact: 'High', status: 'Planned', desc: '' });
        setShowModal(false);
      };

      return (
        <div className="tab-content">
          <div className="section-header">
            <div>
              <h2 className="section-title"><i className="fa-solid fa-road" style={{ color: 'var(--accent-amber)' }}></i> Architectural Horizons & Further Work</h2>
              <p className="section-desc">Technical debt assessment, scalability milestones, and microservices decomposition roadmap.</p>
            </div>
            <button className="btn btn-primary btn-sm" onClick={() => setShowModal(true)}>
              <i className="fa-solid fa-plus"></i> Add Initiative
            </button>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
            {horizons.map(hz => {
              const list = roadmap.filter(r => r.horizon === hz);
              return (
                <div key={hz} className="card">
                  <div className="card-header">
                    <h3 className="card-title"><i className="fa-solid fa-flag-checkered" style={{ color: 'var(--accent-cyan)' }}></i> {hz}</h3>
                    <span className="badge badge-cyan">{list.length} Initiatives</span>
                  </div>
                  <div className="grid-2">
                    {list.map(r => (
                      <div key={r.id} style={{ background: 'rgba(15,23,42,0.6)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-md)', padding: '1rem', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', gap: '0.5rem' }}>
                        <div>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <span className={`badge ${r.impact === 'Critical' ? 'badge-rose' : 'badge-amber'}`}>{r.impact} Impact</span>
                            <button className="btn btn-danger btn-sm" style={{ padding: '0.2rem 0.4rem' }} onClick={() => dispatch({ type: 'DELETE_ROADMAP', payload: r.id })}>
                              <i className="fa-solid fa-trash-can"></i>
                            </button>
                          </div>
                          <h4 style={{ fontSize: '0.95rem', fontWeight: '700', marginTop: '0.5rem' }}>{r.title}</h4>
                          <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>{r.desc}</p>
                        </div>
                        <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                          <span className="badge badge-emerald">{r.status}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          {showModal && (
            <div className="modal-backdrop" onClick={() => setShowModal(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <h3 className="modal-title">Define Architectural Initiative</h3>
                  <button className="btn btn-secondary btn-sm" onClick={() => setShowModal(false)}><i className="fa-solid fa-xmark"></i></button>
                </div>
                <form onSubmit={handleSave}>
                  <div className="modal-body">
                    <div className="form-group">
                      <label className="form-label">Horizon</label>
                      <select className="form-select" value={item.horizon} onChange={e => setItem({ ...item, horizon: e.target.value })}>
                        <option value="Horizon 1 (0-3 Months)">Horizon 1 (0-3 Months)</option>
                        <option value="Horizon 2 (3-6 Months)">Horizon 2 (3-6 Months)</option>
                        <option value="Horizon 3 (6-12 Months)">Horizon 3 (6-12 Months)</option>
                      </select>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Title</label>
                      <input className="form-input" value={item.title} onChange={e => setItem({ ...item, title: e.target.value })} required />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Impact</label>
                      <select className="form-select" value={item.impact} onChange={e => setItem({ ...item, impact: e.target.value })}>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                      </select>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Description</label>
                      <textarea className="form-textarea" value={item.desc} onChange={e => setItem({ ...item, desc: e.target.value })} required />
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn btn-secondary" onClick={() => setShowModal(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Save Initiative</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- COMPONENT: TAB 7 SPEC EXPORTER ---
    const TabExport = () => {
      const project = useSelector(state => state.project.currentProject);
      const [copied, setCopied] = useState(false);
      const md = compileMarkdownSpec(project);

      const handleDownload = () => {
        const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${project.id || 'system'}_SDLC_SPECIFICATION.md`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      };

      const handleCopy = () => {
        navigator.clipboard.writeText(md);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      return (
        <div className="tab-content">
          <div className="section-header">
            <div>
              <h2 className="section-title"><i className="fa-solid fa-file-lines" style={{ color: 'var(--accent-cyan)' }}></i> SDLC Specification Exporter</h2>
              <p className="section-desc">Compile your entire system architecture, ERD, flows, and stories into publication-ready Markdown.</p>
            </div>
            <div style={{ display: 'flex', gap: '0.5rem' }}>
              <button className="btn btn-secondary btn-sm" onClick={() => window.print()}><i className="fa-solid fa-print"></i> Print</button>
              <button className="btn btn-secondary btn-sm" onClick={handleCopy}><i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i> {copied ? 'Copied' : 'Copy Markdown'}</button>
              <button className="btn btn-primary btn-sm" onClick={handleDownload}><i className="fa-solid fa-download"></i> Download .md</button>
            </div>
          </div>

          <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
            <div className="card-header" style={{ padding: '0.75rem 1.25rem', margin: 0 }}>
              <span style={{ fontWeight: '600', fontSize: '0.9rem' }}>Generated Markdown Preview: {project.name}.md</span>
              <span className="badge badge-emerald">Ready</span>
            </div>
            <div style={{ padding: '1.5rem', background: '#050811' }}>
              <pre style={{ fontFamily: 'var(--font-code)', fontSize: '0.85rem', color: '#94a3b8', whiteSpace: 'pre-wrap', maxHeight: '650px', overflowY: 'auto' }}>
                {md}
              </pre>
            </div>
          </div>
        </div>
      );
    };

    // --- MAIN ROOT APPLICATION COMPONENT ---
    const App = () => {
      const activeTab = useSelector(state => state.project.activeTab);
      const alerts = useSelector(state => state.alert);

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          <Navbar />
          <main className="app-container" style={{ flex: 1 }}>
            {alerts.length > 0 && (
              <div className="alert-wrapper">
                {alerts.map(a => (
                  <div key={a.id} className={`alert-banner alert-${a.alertType}`}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <i className={`fa-solid ${a.alertType === 'danger' ? 'fa-circle-exclamation' : 'fa-circle-check'}`}></i>
                      <span>{a.msg}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'overview' && <TabOverview />}
            {activeTab === 'architecture' && <TabArchitecture />}
            {activeTab === 'erd' && <TabErd />}
            {activeTab === 'flows' && <TabFlows />}
            {activeTab === 'stories' && <TabStories />}
            {activeTab === 'roadmap' && <TabRoadmap />}
            {activeTab === 'export' && <TabExport />}
          </main>
          <footer style={{ textAlign: 'center', padding: '1.5rem', borderTop: '1px solid var(--border-color)', color: 'var(--text-dim)', fontSize: '0.8rem' }}>
            PlanCraft SDLC Studio &copy; 2026 &bull; Universal Architecture & System Design Inception Suite
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <Provider store={rootStore}>
        <App />
      </Provider>
    );
  </script>
</body>
</html>
